# FINAL: hard blocks precede gates; memory and allowlisted egress are explicit exceptions to the generic copied-content block.

version: 1
defaults: { action: allow, on_error: block }
rules:
  # --- M4: tool metadata hardening ---
  - id: block-tool-name-collision
    name: Block tools whose name another wrapped server already exposes
    when:
      direction: response
      name_collision_detected: true
    action: block
    reason: Another wrapped server already exposes a tool with this name.

  - id: block-tool-shadowing
    name: Block metadata that references another server's tools
    when:
      direction: response
      tool_shadowing_detected: true
    action: block
    reason: Tool metadata references a tool that belongs to a different server.
  # --- end M4 ---

  # --- M3: research read-only with bounded output writes ---
  - id: deny-server-sampling
    when: { direction: request, method: sampling/createMessage }
    action: block
    reason: Research sessions do not permit server-initiated model access.

  - id: block-research-critical-path
    when:
      {
        direction: request,
        critical_path: true,
        capabilities_any: [ file_write, writes_local, deletes_data ]
      }
    action: block
    reason: Research output cannot change critical configuration or execution targets.

  - id: block-research-nonfile-sink
    when:
      {
        direction: request,
        tool_class: sink,
        capabilities_any:
          [
            network_egress,
            sends_message,
            writes_remote,
            persists_memory,
            executes_code,
            deletes_data
          ]
      }
    action: block
    reason: Research sessions permit only local output file writes.
  - id: approve-elicitation
    when:
      direction: request
      method: elicitation/create
    action: require_approval
    reason: Server requested user input through elicitation.
  - id: approve-quarantined-output
    when:
      direction: request
      tool_class: sink
      output_path_allowed: true
      capabilities_all:
        - writes_local
      session_quarantined: true
    action: require_approval
    reason: Research output requires approval while a session gate is active.
  - id: approve-rate-limited-output
    when:
      direction: request
      tool_class: sink
      output_path_allowed: true
      capabilities_all:
        - writes_local
      rate_limited: true
    action: require_approval
    reason: Research output requires approval while a session gate is active.
  - id: approve-looping-output
    when:
      direction: request
      tool_class: sink
      output_path_allowed: true
      capabilities_all:
        - writes_local
      loop_detected: true
    action: require_approval
    reason: Research output requires approval while a session gate is active.

  - id: allow-research-source
    when: { direction: request, tool_class: source }
    action: allow
    reason: Read-only sources are permitted.

  - id: allow-research-output
    when:
      {
        direction: request,
        tool_class: sink,
        capabilities_all: [ writes_local ],
        output_path_allowed: true
      }
    action: allow
    reason: Every file target is inside the configured research output directory.

  - id: block-research-sink
    when: { direction: request, tool_class: sink }
    action: block
    reason: Research sessions block sinks outside the output directory.

  - id: block-research-unknown-tool
    when: { direction: request, method: tools/call, tool_class: unknown }
    action: block
    reason: Unknown tools cannot be verified as read-only.

  - id: sanitize-hidden-unicode-metadata
    name: Strip hidden Unicode from metadata
    when:
      direction: response
      hidden_unicode_detected: true
    action: sanitize
    reason: Metadata contains hidden Unicode characters.
