version: 1
defaults:
  action: allow
  on_error: log_only

rules:
  - id: log-suspicious-tool-metadata
    when:
      direction: response
      method: tools/list
      detector_score_gte: 0.35
    action: log_only
    reason: Tool metadata has prompt-injection indicators.

  # --- M4: tool metadata hardening ---
  - id: log-tool-metadata-findings
    when:
      direction: response
      tool_shadowing_detected: true
    action: log_only
    reason: Tool metadata references another server's tool; enforcing presets block it.

  - id: log-tool-name-collision
    when:
      direction: response
      name_collision_detected: true
    action: log_only
    reason: Another wrapped server exposes a tool with this name; enforcing presets block it.

  - id: log-hidden-unicode-metadata
    when:
      direction: response
      hidden_unicode_detected: true
    action: log_only
    reason: Metadata contains hidden Unicode; enforcing presets strip it.
  # --- end M4 ---

  - id: log-tainted-sinks
    when:
      direction: request
      method: tools/call
      tool_class: sink
      taint: true
    action: log_only
    reason: Tainted content would enter a sink under enforcing policies.

  - id: log-resource-prompt-injection
    when:
      direction: response
      method:
        - resources/read
        - prompts/get
      detector_score_gte: 0.35
    action: log_only
    reason: Resource or prompt content would be sanitized under enforcing policies.

  - id: log-sampling
    when:
      direction: request
      method: sampling/createMessage
    action: log_only
    reason: Server requested model access.
