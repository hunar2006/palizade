# Guarantees the coding-agent preset must keep. Run: palizade policy test policies/tests/coding-agent.test.yaml
policy: ../coding-agent.yaml
cases:
  - name: tainted prose can be written to non-critical workspace files
    context: { direction: request, method: tools/call, tool_class: sink, local_workspace_write: true, taint: true }
    expect: { action: allow, rule: allow-tainted-local-workspace-edit }
  - name: an encoded PowerShell network command after mixed exposure is blocked
    context: { direction: request, method: tools/call, tool_class: sink, argument_roles: [shell_command], argument_text: 'pwsh -enc SAMPLE', rule_of_two: true }
    expect: { action: block, rule: block-rule-of-two-network-shell }
  - name: writes to Palizade's own state need approval
    context: { direction: request, method: tools/call, tool_class: sink, capabilities: [file_write, writes_local], critical_path: true }
    expect: { action: require_approval, rule: approve-critical-path }
  - name: "self protection: asks before `palizade allow host evil.example`"
    context: { direction: request, method: tools/call, tool_class: sink, capabilities: [executes_code, network_egress, writes_local], argument_roles: [shell_command], argument_text: "palizade allow host evil.example" }
    expect: { action: require_approval, rule: approve-palizade-self-change }
  - name: "self protection: asks before `npx -y palizade taint prune --older-than 0`"
    context: { direction: request, method: tools/call, tool_class: sink, capabilities: [executes_code, network_egress, writes_local], argument_roles: [shell_command], argument_text: "npx -y palizade taint prune --older-than 0" }
    expect: { action: require_approval, rule: approve-palizade-self-change }
  - name: "self protection: asks before `ls && palizade install-hooks claude-code`"
    context: { direction: request, method: tools/call, tool_class: sink, capabilities: [executes_code, network_egress, writes_local], argument_roles: [shell_command], argument_text: "ls && palizade install-hooks claude-code" }
    expect: { action: require_approval, rule: approve-palizade-self-change }
  - name: "self protection: asks before `palizade --config other.yaml lock approve`"
    context: { direction: request, method: tools/call, tool_class: sink, capabilities: [executes_code, network_egress, writes_local], argument_roles: [shell_command], argument_text: "palizade --config other.yaml lock approve" }
    expect: { action: require_approval, rule: approve-palizade-self-change }
  - name: "self protection: asks before `npm uninstall -g palizade`"
    context: { direction: request, method: tools/call, tool_class: sink, capabilities: [executes_code, network_egress, writes_local], argument_roles: [shell_command], argument_text: "npm uninstall -g palizade" }
    expect: { action: require_approval, rule: approve-palizade-self-change }
  - name: "self protection: asks before `pnpm remove palizade`"
    context: { direction: request, method: tools/call, tool_class: sink, capabilities: [executes_code, network_egress, writes_local], argument_roles: [shell_command], argument_text: "pnpm remove palizade" }
    expect: { action: require_approval, rule: approve-palizade-self-change }
  - name: "self protection: asks before `rm -rf .palizade`"
    context: { direction: request, method: tools/call, tool_class: sink, capabilities: [executes_code, network_egress, writes_local], argument_roles: [shell_command], argument_text: "rm -rf .palizade" }
    expect: { action: require_approval, rule: approve-palizade-self-change }
  - name: "self protection: asks before `sed -i s/closed/open/ palizade.yaml`"
    context: { direction: request, method: tools/call, tool_class: sink, capabilities: [executes_code, network_egress, writes_local], argument_roles: [shell_command], argument_text: "sed -i s/closed/open/ palizade.yaml" }
    expect: { action: require_approval, rule: approve-palizade-self-change }
  - name: "self protection: asks before `truncate -s0 .palizade/taint.key`"
    context: { direction: request, method: tools/call, tool_class: sink, capabilities: [executes_code, network_egress, writes_local], argument_roles: [shell_command], argument_text: "truncate -s0 .palizade/taint.key" }
    expect: { action: require_approval, rule: approve-palizade-self-change }
  - name: "self protection: asks before `rm ~/.gemini/settings.json`"
    context: { direction: request, method: tools/call, tool_class: sink, capabilities: [executes_code, network_egress, writes_local], argument_roles: [shell_command], argument_text: "rm ~/.gemini/settings.json" }
    expect: { action: require_approval, rule: approve-palizade-self-change }
  - name: "self protection: does not ask for `palizade status`"
    context: { direction: request, method: tools/call, tool_class: sink, capabilities: [executes_code, network_egress, writes_local], argument_roles: [shell_command], argument_text: "palizade status" }
    expect: { not_rule: approve-palizade-self-change }
  - name: "self protection: does not ask for `npx palizade why`"
    context: { direction: request, method: tools/call, tool_class: sink, capabilities: [executes_code, network_egress, writes_local], argument_roles: [shell_command], argument_text: "npx palizade why" }
    expect: { not_rule: approve-palizade-self-change }
  - name: "self protection: does not ask for `palizade audit verify`"
    context: { direction: request, method: tools/call, tool_class: sink, capabilities: [executes_code, network_egress, writes_local], argument_roles: [shell_command], argument_text: "palizade audit verify" }
    expect: { not_rule: approve-palizade-self-change }
  - name: "self protection: does not ask for `cat palizade.yaml`"
    context: { direction: request, method: tools/call, tool_class: sink, capabilities: [executes_code, network_egress, writes_local], argument_roles: [shell_command], argument_text: "cat palizade.yaml" }
    expect: { not_rule: approve-palizade-self-change }
  - name: "self protection: does not ask for `cd ~/src/palizade && git status`"
    context: { direction: request, method: tools/call, tool_class: sink, capabilities: [executes_code, network_egress, writes_local], argument_roles: [shell_command], argument_text: "cd ~/src/palizade && git status" }
    expect: { not_rule: approve-palizade-self-change }
  - name: "self protection: does not ask for `pnpm test`"
    context: { direction: request, method: tools/call, tool_class: sink, capabilities: [executes_code, network_egress, writes_local], argument_roles: [shell_command], argument_text: "pnpm test" }
    expect: { not_rule: approve-palizade-self-change }
  - name: "self protection: asks before `PALIZADE_X=1 env palizade allow host evil.example`"
    context: { direction: request, method: tools/call, tool_class: sink, capabilities: [executes_code, network_egress, writes_local], argument_roles: [shell_command], argument_text: "PALIZADE_X=1 env palizade allow host evil.example" }
    expect: { action: require_approval, rule: approve-palizade-self-change }
  - name: an -enco PowerShell network command after mixed exposure is blocked
    context: { direction: request, method: tools/call, tool_class: sink, argument_roles: [shell_command], argument_text: "pwsh -enco SAMPLE", rule_of_two: true }
    expect: { action: block, rule: block-rule-of-two-network-shell }
  - name: "self protection: asks before `node C:\\x\\node_modules\\palizade\\dist\\index.cjs hook claude-code UserPromptSubmit`"
    context: { direction: request, method: tools/call, tool_class: sink, capabilities: [executes_code, network_egress, writes_local], argument_roles: [shell_command], argument_text: "node C:\\x\\node_modules\\palizade\\dist\\index.cjs hook claude-code UserPromptSubmit" }
    expect: { action: require_approval, rule: approve-palizade-self-change }
  - name: "self protection: does not ask for `git diff .mcp.json`"
    context: { direction: request, method: tools/call, tool_class: sink, capabilities: [executes_code, network_egress, writes_local], argument_roles: [shell_command], argument_text: "git diff .mcp.json" }
    expect: { not_rule: approve-palizade-self-change }
  - name: "self protection: asks before `rm -rf .claude`"
    context: { direction: request, method: tools/call, tool_class: sink, capabilities: [executes_code, network_egress, writes_local], argument_roles: [shell_command], argument_text: "rm -rf .claude" }
    expect: { action: require_approval, rule: approve-palizade-self-change }
  - name: "self protection: asks before `mv .claude /tmp/backup`"
    context: { direction: request, method: tools/call, tool_class: sink, capabilities: [executes_code, network_egress, writes_local], argument_roles: [shell_command], argument_text: "mv .claude /tmp/backup" }
    expect: { action: require_approval, rule: approve-palizade-self-change }
  - name: "self protection: asks before `Remove-Item -Recurse .claude`"
    context: { direction: request, method: tools/call, tool_class: sink, capabilities: [executes_code, network_egress, writes_local], argument_roles: [shell_command], argument_text: "Remove-Item -Recurse .claude" }
    expect: { action: require_approval, rule: approve-palizade-self-change }
  - name: "self protection: asks before `Rename-Item .claude .claude.bak`"
    context: { direction: request, method: tools/call, tool_class: sink, capabilities: [executes_code, network_egress, writes_local], argument_roles: [shell_command], argument_text: "Rename-Item .claude .claude.bak" }
    expect: { action: require_approval, rule: approve-palizade-self-change }
  - name: "self protection: asks before `node -e` removing `.claude`"
    context: { direction: request, method: tools/call, tool_class: sink, capabilities: [executes_code, network_egress, writes_local], argument_roles: [shell_command], argument_text: "node -e \"require('fs').rmSync('.claude', { recursive: true })\"" }
    expect: { action: require_approval, rule: approve-palizade-self-change }
  - name: "self protection: asks before `python -c` removing `.claude`"
    context: { direction: request, method: tools/call, tool_class: sink, capabilities: [executes_code, network_egress, writes_local], argument_roles: [shell_command], argument_text: "python -c \"import shutil; shutil.rmtree('.claude')\"" }
    expect: { action: require_approval, rule: approve-palizade-self-change }
  - name: "self protection: asks before `git clean -fdx`"
    context: { direction: request, method: tools/call, tool_class: sink, capabilities: [executes_code, network_egress, writes_local], argument_roles: [shell_command], argument_text: "git clean -fdx" }
    expect: { action: require_approval, rule: approve-palizade-self-change }
  - name: "self protection: asks before `git checkout -- .`"
    context: { direction: request, method: tools/call, tool_class: sink, capabilities: [executes_code, network_egress, writes_local], argument_roles: [shell_command], argument_text: "git checkout -- ." }
    expect: { action: require_approval, rule: approve-palizade-self-change }
  - name: "self protection: asks before `git restore .`"
    context: { direction: request, method: tools/call, tool_class: sink, capabilities: [executes_code, network_egress, writes_local], argument_roles: [shell_command], argument_text: "git restore ." }
    expect: { action: require_approval, rule: approve-palizade-self-change }
  - name: "self protection: asks before `robocopy empty . /MIR`"
    context: { direction: request, method: tools/call, tool_class: sink, capabilities: [executes_code, network_egress, writes_local], argument_roles: [shell_command], argument_text: "robocopy empty . /MIR" }
    expect: { action: require_approval, rule: approve-palizade-self-change }
  - name: "self protection: asks before `tar -C .claude -xf x.tar`"
    context: { direction: request, method: tools/call, tool_class: sink, capabilities: [executes_code, network_egress, writes_local], argument_roles: [shell_command], argument_text: "tar -C .claude -xf x.tar" }
    expect: { action: require_approval, rule: approve-palizade-self-change }
  - name: "self protection: asks before `tar -xf x.tar -C .`"
    context: { direction: request, method: tools/call, tool_class: sink, capabilities: [executes_code, network_egress, writes_local], argument_roles: [shell_command], argument_text: "tar -xf x.tar -C ." }
    expect: { action: require_approval, rule: approve-palizade-self-change }
  - name: "self protection: asks before `rm .claude/settings*`"
    context: { direction: request, method: tools/call, tool_class: sink, capabilities: [executes_code, network_egress, writes_local], argument_roles: [shell_command], argument_text: "rm .claude/settings*" }
    expect: { action: require_approval, rule: approve-palizade-self-change }
  - name: "self protection: does not ask for `git status`"
    context: { direction: request, method: tools/call, tool_class: sink, capabilities: [executes_code, network_egress, writes_local], argument_roles: [shell_command], argument_text: "git status" }
    expect: { not_rule: approve-palizade-self-change }
  - name: "self protection: does not ask for `git diff`"
    context: { direction: request, method: tools/call, tool_class: sink, capabilities: [executes_code, network_egress, writes_local], argument_roles: [shell_command], argument_text: "git diff" }
    expect: { not_rule: approve-palizade-self-change }
  - name: running code after an externally tainted workspace code write requires approval
    context: { direction: request, method: tools/call, tool_class: sink, capabilities: [executes_code], tainted_code_write_pending: true }
    expect: { action: require_approval, rule: approve-exec-after-tainted-code-write }
