# FINAL: hard blocks precede gates; memory and allowlisted egress are explicit exceptions to the generic copied-content block.

version: 1
defaults:
  action: allow
  on_error: block

rules:

  # --- M1: destination provenance ---
  - id: block-tainted-destination
    when: { direction: request, tool_class: sink, tainted_destination: true }
    action: block
    reason: Destination came from untrusted content.

  - id: block-lookalike-destination
    when: { direction: request, tool_class: sink, lookalike_destination: true }
    action: block
    reason: Destination is a lookalike of a known host.

  - id: deny-server-sampling
    name: Deny server-initiated model access
    when:
      direction: request
      method: sampling/createMessage
    action: block
    reason: MCP server attempted to access the model through sampling.

  # --- M4: tool metadata hardening ---
  - id: block-tool-name-collision
    name: Block tools whose name another wrapped server already exposes
    when:
      direction: response
      name_collision_detected: true
    action: block
    reason: Another wrapped server already exposes a tool with this name.

  - id: block-tool-shadowing
    name: Block metadata that references another server's tools
    when:
      direction: response
      tool_shadowing_detected: true
    action: block
    reason: Tool metadata references a tool that belongs to a different server.
  # --- end M4 ---

  - id: block-poisoned-tool-metadata
    name: Block poisoned tool metadata
    when:
      direction: response
      method: tools/list
      detector_score_gte: 0.75
    action: block
    reason: Tool metadata looks like prompt injection or tool poisoning.

  - id: block-untrusted-unknown-tool
    name: Block unknown tools on untrusted servers
    when:
      direction: request
      method: tools/call
      trust: untrusted
      tool_class: unknown
    action: block
    reason: Unknown tools on untrusted servers must be classified explicitly.

  - id: block-secret-egress
    name: Block sensitive taint entering egress tools
    when:
      direction: request
      method: tools/call
      sensitive_taint: true
      capabilities_any:
        - network_egress
        - sends_message
        - writes_remote
        - file_write
        - writes_local
    action: block
    reason: Secret/credential is being sent to an external destination.

  - id: block-secret-detected-egress
    name: Block directly detected secrets entering egress tools
    when:
      direction: request
      method: tools/call
      secret_detected: true
      capabilities_any:
        - network_egress
        - sends_message
        - writes_remote
        - file_write
        - writes_local
    action: block
    reason: Secret-looking content is being sent to an egress-capable tool.

  - id: block-sensitive-into-untrusted-destination
    name: Block sensitive data to destinations outside the allowlist
    when:
      direction: request
      method: tools/call
      tool_class: sink
      taint: true
      destination_allowed: false
      capabilities_any:
        - network_egress
        - sends_message
        - writes_remote
    action: block
    reason: Tainted content is flowing to a destination outside the egress allowlist.

  # --- M1: split-call correlation ---
  - id: block-split-match
    when: { direction: request, tool_class: sink, split_match: true }
    action: block
    reason: Split outbound calls reconstruct tainted content.

  - id: block-tainted-egress-destination
    name: Block tainted outbound destinations
    when:
      direction: request
      method: tools/call
      tool_class: sink
      capabilities_any:
        - network_egress
        - sends_message
      tainted_argument_role_any:
        - url
        - hostname
        - email_recipient
        - http_query
    action: block
    reason: Tainted content is being used as an outbound destination or query
      parameter.

  # --- M3: persistent memory provenance ---
  - id: approve-tainted-memory
    when: { direction: request, capabilities_any: [ persists_memory ], taint: true }
    action: require_approval
    reason: Tainted content is being persisted into memory.

  - id: redact-pii-egress
    name: Redact detected PII before message egress
    when:
      direction: request
      method: tools/call
      pii_detected: true
      capabilities_any:
        - sends_message
        - network_egress
      critical_path: false
      temporal_taint: false
      session_quarantined: false
      rate_limited: false
      loop_detected: false
    action: redact_secrets
    reason: PII-like content should be redacted before egress.

  - id: block-copied-shell-command
    name: Block shell commands copied from untrusted content that are not on the short list
    when: { direction: request, method: tools/call, tool_class: sink, tainted_argument_role_any: [ shell_command ], tainted_local_command: false }
    action: block
    reason: This shell command's text came from untrusted content.

  - id: allow-tainted-allowed-egress-destination
    name: Allow tainted data only to explicitly allowlisted egress destinations
    when:
      direction: request
      method: tools/call
      tool_class: sink
      taint: true
      destination_allowed: true
      destination_allowlist_configured: true
      argument_role_any:
        - url
        - hostname
        - email_recipient
        - repository_destination
        - channel_id
        - account_id
      session_quarantined: false
      rate_limited: false
      loop_detected: false
      capabilities_any:
        - network_egress
        - sends_message
        - writes_remote
      critical_path: false
      temporal_taint: false
      pii_detected: false
      tainted_code_write_pending: false
      tainted_local_command: false
    action: allow
    reason: Tainted egress destination is explicitly allowlisted.

  - id: block-tainted-sink
    name: Block tainted content entering sinks
    when:
      direction: request
      method: tools/call
      tool_class: sink
      taint: true
      tainted_local_command: false
    action: block
    reason: Tainted content is flowing into a sink tool.

  - id: approve-exec-after-tainted-code-write
    name: Ask before running code after a tainted workspace code or build file write
    when:
      direction: request
      capabilities_any: [ executes_code ]
      tainted_code_write_pending: true
    action: require_approval
    reason: A workspace code or build file was written using text from an untrusted source. Review the edit before running this command.

  - id: approve-tainted-local-command
    name: Ask before running a local command copied from untrusted content
    when: { direction: request, method: tools/call, tool_class: sink, tainted_local_command: true }
    action: require_approval
    reason: This command's text came from untrusted content.

  - id: approve-semi-unknown-tool
    name: Require approval for unknown tools on semi-trusted servers
    when:
      direction: request
      method: tools/call
      trust: semi
      tool_class: unknown
    action: require_approval
    reason: Unknown tools on semi-trusted servers require approval.

  - id: require-approval-temporal-taint-sink
    name: Require approval during temporal taint
    when:
      direction: request
      method: tools/call
      tool_class: sink
      temporal_taint: true
    action: require_approval
    reason: Recent suspicious untrusted content makes sink calls risky.

  # --- M2: session quarantine ---
  - id: approve-quarantined-sink
    when: { direction: request, tool_class: sink, session_quarantined: true }
    action: require_approval
    reason: Session is quarantined after high-risk content or a blocked destination.

  # --- M2: rate and loop gates ---
  - id: approve-rate-limited-sink
    when: { direction: request, tool_class: sink, rate_limited: true }
    action: require_approval
    reason: Session sink rate or distinct destination limit exceeded.

  - id: approve-looping-sink
    when: { direction: request, tool_class: sink, loop_detected: true }
    action: require_approval
    reason: Identical sink call repeated too many times.

  # --- M3: protected targets ---
  - id: approve-critical-path
    when:
      {
        direction: request,
        critical_path: true,
        capabilities_any: [ file_write, writes_local, deletes_data ]
      }
    action: require_approval
    reason: Writing a critical configuration or execution target requires approval.

  - id: approve-palizade-self-change
    name: Ask before a shell command changes or removes Palizade
    when:
      direction: request
      argument_role_any: [ shell_command ]
      argument_regex: '^(?:[\s\S]{16385}|(?:(?=(?<text>[^"'';&|({)\n\x60]+))\k<text>|"(?:[^"\\]|\\[\s\S])*"|''[^'']*''|[;&|({)\n\x60])*?(?<=^|[;&|({\n\x60])[\t \r]*(?:(?:(?:["'']?(?:[^\s"'';&|(){}\x60]*[\\/])?(?:(?:bash|sh|zsh|pwsh|powershell|eval|iex|invoke-expression|xargs|timeout|nice|doas|busybox)(?:\.exe|\.cmd)?|(?:env|sudo)(?=[ \t]+-)|cmd(?:\.exe)?[ \t]+\/[ck])["'']?|then|do|else)[ \t]+|(?:%[ \t]*)?\{[ \t]*)(?:[^"'';&|\r\n]*"(?:(?=[^"\r\n]*(?:\.(?:palizade|claude|cursor|codex|gemini|mcp)\b|palizade\.(?:ya?ml\b|allow\.ya?ml\b|lock\b|\*)|claude_desktop_config\.(?:json\b|\*)))[^"\r\n]*?(?<![\w.-])(?:rm|rmdir|rd|mv|del|erase|remove-item|move-item|rename-item|ren|shred|unlink|cp|sed|perl|python3?|node|ruby|truncate|tee|dd|ln|chmod|chown|chattr|touch|install|copy|xcopy|robocopy|copy-item|set-content|out-file|clear-content)(?:\.exe|\.cmd)?["'']?[ \t]+[^"\r\n]*(?:\.(?:palizade|claude|cursor|codex|gemini|mcp)\b|palizade\.(?:ya?ml\b|allow\.ya?ml\b|lock\b|\*)|claude_desktop_config\.(?:json\b|\*))|(?=[^"\r\n]*\bpalizade\b)[^"\r\n]*?(?<![\w.-])(?:npm|pnpm|yarn|bun)(?:\.exe|\.cmd)?["'']?[ \t]+(?:--?[^\s;&|]+[ \t]+)*(?:uninstall|remove|rm|r|un|unlink)[ \t]+[^"\r\n]*\bpalizade\b)|[^"'';&|\r\n]*''(?:(?=[^''\r\n]*(?:\.(?:palizade|claude|cursor|codex|gemini|mcp)\b|palizade\.(?:ya?ml\b|allow\.ya?ml\b|lock\b|\*)|claude_desktop_config\.(?:json\b|\*)))[^''\r\n]*?(?<![\w.-])(?:rm|rmdir|rd|mv|del|erase|remove-item|move-item|rename-item|ren|shred|unlink|cp|sed|perl|python3?|node|ruby|truncate|tee|dd|ln|chmod|chown|chattr|touch|install|copy|xcopy|robocopy|copy-item|set-content|out-file|clear-content)(?:\.exe|\.cmd)?["'']?[ \t]+[^''\r\n]*(?:\.(?:palizade|claude|cursor|codex|gemini|mcp)\b|palizade\.(?:ya?ml\b|allow\.ya?ml\b|lock\b|\*)|claude_desktop_config\.(?:json\b|\*))|(?=[^''\r\n]*\bpalizade\b)[^''\r\n]*?(?<![\w.-])(?:npm|pnpm|yarn|bun)(?:\.exe|\.cmd)?["'']?[ \t]+(?:--?[^\s;&|]+[ \t]+)*(?:uninstall|remove|rm|r|un|unlink)[ \t]+[^''\r\n]*\bpalizade\b)|(?:(?=[^;&|{\r\n]*(?:\.(?:palizade|claude|cursor|codex|gemini|mcp)\b|palizade\.(?:ya?ml\b|allow\.ya?ml\b|lock\b|\*)|claude_desktop_config\.(?:json\b|\*)))[^;&|{\r\n]*?(?<![\w.-])(?:rm|rmdir|rd|mv|del|erase|remove-item|move-item|rename-item|ren|shred|unlink|cp|sed|perl|python3?|node|ruby|truncate|tee|dd|ln|chmod|chown|chattr|touch|install|copy|xcopy|robocopy|copy-item|set-content|out-file|clear-content)(?:\.exe|\.cmd)?["'']?[ \t]+[^;&|{\r\n]*(?:\.(?:palizade|claude|cursor|codex|gemini|mcp)\b|palizade\.(?:ya?ml\b|allow\.ya?ml\b|lock\b|\*)|claude_desktop_config\.(?:json\b|\*))|(?=[^;&|{\r\n]*\bpalizade\b)[^;&|{\r\n]*?(?<![\w.-])(?:npm|pnpm|yarn|bun)(?:\.exe|\.cmd)?["'']?[ \t]+(?:--?[^\s;&|]+[ \t]+)*(?:uninstall|remove|rm|r|un|unlink)[ \t]+[^;&|{\r\n]*\bpalizade\b))|(?=[^\s;&|()\x60])(?:(?:sudo|env|command|exec|nohup|time|start-process(?:[ \t]+-filepath)?|cmd(?:\.exe)?[ \t]+\/[ck])[ \t]+|\w+=\S*[ \t]+)*(?:(?:(?:npx|bunx|pnpx)(?:[ \t]+(?:-y|--yes))?[ \t]+|(?:npm[ \t]+exec|pnpm[ \t]+(?:exec|dlx)|yarn[ \t]+(?:exec|dlx)|bun[ \t]+(?:x|exec))(?:[ \t]+(?:-y|--yes))?[ \t]+(?:--[ \t]+)?)?(?:(?:node|bun|deno(?:[ \t]+run)?)[ \t]+(?:--\S+[ \t]+)*)?["'']?(?:(?:(?:(?<=["''])[^\s"'']*|[^\s"'';&|(){}\x60]*)[\\/])?palizade(?:@\S+)?(?:\.c?js|\.cmd|\.exe)?|(?:(?<=["''])[^\s"'']*(?:palizade[^\s"'']*[\\/]dist[\\/]index|packages[\\/]cli[\\/]dist[\\/]index)\.(?:c?js|ts)|[^\s"'';&|(){}\x60]*(?:palizade[^\s"'';&|(){}\x60]*[\\/]dist[\\/]index|packages[\\/]cli[\\/]dist[\\/]index)\.(?:c?js|ts)))["'']?[ \t]+(?:(?:--|-(?:argumentlist|args))[ \t]+)?["'']?(?!(?:status|why|doctor|tools|scan|wrap|serve|audit\b(?![ \t]+prune)|lock[ \t]+diff|policy[ \t]+(?:check|test)|allow[ \t]+list|-V|--version|-h|--help|help)(?:[\s"'';&|)]|$))|["'']?(?:(?:(?<=["''])[^\s"'';&|]*|[^\s"'';&|(){}\x60]*)[\\/])?(?:npm|pnpm|yarn|bun)(?:\.exe|\.cmd)?["'']?[ \t]+(?:--?[^\s;&|]+[ \t]+)*(?:uninstall|remove|rm|r|un|unlink)[ \t]+[^;&|\n]*\bpalizade\b|["'']?(?:(?:(?<=["''])[^\s"'';&|]*|[^\s"'';&|(){}\x60]*)[\\/])?(?:rm|rmdir|rd|mv|del|erase|remove-item|move-item|rename-item|ren|shred|unlink|cp|sed|perl|python3?|node|ruby|truncate|tee|dd|ln|chmod|chown|chattr|touch|install|git[ \t]+(?:checkout|restore|rm|mv|apply|reset|clean)|copy|xcopy|robocopy|tar|copy-item|set-content|out-file|clear-content)(?:\.exe|\.cmd)?["'']?[ \t]+[^;&|\n]*(?:\.(?:palizade|claude|cursor|codex|gemini|mcp)\b|palizade\.(?:ya?ml\b|allow\.ya?ml\b|lock\b|\*)|claude_desktop_config\.(?:json\b|\*))|["'']?(?:(?:(?<=["''])[^\s"'';&|]*|[^\s"'';&|(){}\x60]*)[\\/])?(?:python3?|node|perl|ruby)(?:\.exe|\.cmd)?["'']?[ \t]+(?:[^;&|\n]*?[ \t]+)?(?:-[ec]|--eval)(?:[ \t]+|=)(?:"[^"]*?(?:\.(?:palizade|claude|cursor|codex|gemini|mcp)\b|palizade\.(?:ya?ml\b|allow\.ya?ml\b|lock\b|\*)|claude_desktop_config\.(?:json\b|\*))|''[^'']*?(?:\.(?:palizade|claude|cursor|codex|gemini|mcp)\b|palizade\.(?:ya?ml\b|allow\.ya?ml\b|lock\b|\*)|claude_desktop_config\.(?:json\b|\*)))|["'']?(?:(?:(?<=["''])[^\s"'';&|]*|[^\s"'';&|(){}\x60]*)[\\/])?(?:git[ \t]+clean)(?:\.exe|\.cmd)?["'']?(?=$|[\s"'';&|)])|["'']?(?:(?:(?<=["''])[^\s"'';&|]*|[^\s"'';&|(){}\x60]*)[\\/])?(?:rm|rmdir|rd|mv|del|erase|remove-item|move-item|rename-item|ren|shred|unlink|git[ \t]+(?:rm|mv))(?:\.exe|\.cmd)?["'']?[ \t]+[^;&|\n]*(?:(?<=[\s"''\\/])\.(?:cl(?:a(?:u(?:d(?:e)?)?)?)?|pal(?:i(?:z(?:a(?:d(?:e)?)?)?)?)?|cu(?:r(?:s(?:o(?:r)?)?)?)?|co(?:d(?:e(?:x)?)?)?|ge(?:m(?:i(?:n(?:i)?)?)?)?)\*(?=$|[\s"''\\/;&|)])|(?<=[\t "''=])(?:\.\.(?:[\\/]\*?)?|\.[\\/]\*|\*)(?=$|[\s"'';&|)]))|["'']?(?:(?:(?<=["''])[^\s"'';&|]*|[^\s"'';&|(){}\x60]*)[\\/])?(?:git[ \t]+(?:checkout|restore))(?:\.exe|\.cmd)?["'']?[ \t]+(?:[^;&|\n]*[\t "''=])?(?:\.\.?(?:[\\/]\*?)?|\*)(?=$|[\s"'';&|)])|["'']?(?:(?:(?<=["''])[^\s"'';&|]*|[^\s"'';&|(){}\x60]*)[\\/])?(?:robocopy)(?:\.exe|\.cmd)?["'']?[ \t]+[^;&|\n]*[ \t]\/(?:mir|purge)(?=$|[\s"'';&|)])|["'']?(?:(?:(?<=["''])[^\s"'';&|]*|[^\s"'';&|(){}\x60]*)[\\/])?(?:tar)(?:\.exe|\.cmd)?["'']?[ \t]+(?=(?:[^;&|\n]*[ \t])?(?:--extract|--get|-[a-z]*x[a-z]*|[a-z]*x[a-z]*)(?=$|[\s"'';&|)]))[^;&|\n]*(?<=[ \t])(?:-C|--directory)(?:[ \t]+|=)["'']?\.(?:[\\/])?(?=$|[\s"'';&|)]))))'
    action: require_approval
    reason: This shell command changes, prunes or removes Palizade's own configuration, state or hooks.
  - id: approve-elicitation
    when:
      direction: request
      method: elicitation/create
    action: require_approval
    reason: Server requested user input through elicitation.

  - id: sanitize-hidden-unicode-metadata
    name: Strip hidden Unicode from metadata
    when:
      direction: response
      hidden_unicode_detected: true
    action: sanitize
    reason: Metadata contains hidden Unicode characters.

  - id: log-unapproved-tool-metadata
    name: Surface tool lock drift
    when:
      direction: response
      method: tools/list
      lock_status:
        - missing
        - new
        - changed
    action: log_only
    reason: Tool metadata is not approved in palizade.lock.

  - id: sanitize-suspicious-untrusted-output
    name: Spotlight suspicious untrusted output
    when:
      direction: response
      method: tools/call
      detector_score_gte: 0.35
    action: sanitize
    reason: Untrusted tool output contains injection-like signals.

  - id: sanitize-suspicious-resource-content
    name: Spotlight suspicious resource content
    when:
      direction: response
      method:
        - resources/read
        - prompts/get
      detector_score_gte: 0.35
    action: sanitize
    reason: Resource or prompt content contains injection-like signals.

  - id: sanitize-strong-injection-any-trust
    name: Spotlight strong injection signals regardless of trust
    when:
      direction: response
      method: tools/call
      detector_score_gte: 0.75
    action: sanitize
    reason: Strong injection signal in tool output.
