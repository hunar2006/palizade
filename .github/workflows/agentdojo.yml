name: AgentDojo

# Held out evaluation; slower than CI, so it runs weekly and on demand.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agentdojo:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm build
      - name: Install AgentDojo
        run: |
          python3 -m venv .venv-agentdojo
          .venv-agentdojo/bin/pip install --quiet agentdojo==0.1.35
      - name: Replay and score, fail on regression
        env:
          PALIZADE_PYTHON: .venv-agentdojo/bin/python
        run: pnpm eval:agentdojo --policies default --out .palizade/agentdojo-results --compare results/agentdojo/user-intent
